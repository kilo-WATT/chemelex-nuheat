name: Library bug
description: Report a problem with the Python API client.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, authorization codes, serial numbers, account identifiers, or private API responses.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the client behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: chemelex-nuheat version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.14.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic values and redact all private data.
    validations:
      required: true

